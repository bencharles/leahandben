<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>RSVP — Leah &amp; Ben</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --amber:#C8985A;--amber-dark:#9A7230;
      --cream:#F6EFE0;--warm-dark:#26180A;
      --forest:#0C1908;--diag:68px;
    }
    html,body{height:100%;font-family:'Jost',sans-serif;color:var(--warm-dark);overflow-x:hidden;-webkit-font-smoothing:antialiased;background:var(--cream)}

    /* ══ NAV ══ */
    nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:center;gap:clamp(6px,2vw,14px);padding:clamp(10px,2vw,16px) 20px;background:rgba(246,239,224,0.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(200,152,90,0.18)}
    .tab-btn{font-family:'Jost',sans-serif;font-size:0.64rem;font-weight:300;letter-spacing:0.36em;text-transform:uppercase;background:none;border:none;cursor:pointer;color:#9a8a7a;padding:8px 18px;border-radius:30px;transition:color 0.2s,background 0.2s;text-decoration:none;display:inline-block}
    .tab-btn.active{color:var(--warm-dark);background:rgba(200,152,90,0.15)}
    .tab-btn:hover{color:var(--warm-dark)}

    /* ══ PAGE HEADER ══ */
    .page-header{padding:clamp(100px,14vw,140px) 20px clamp(48px,6vw,64px);text-align:center;background:var(--cream);border-bottom:1px solid rgba(200,152,90,0.15)}
    .page-eyebrow{font-size:0.6rem;letter-spacing:0.44em;text-transform:uppercase;color:var(--amber-dark);font-weight:300;margin-bottom:14px}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.8rem,8vw,5.5rem);font-weight:300;color:var(--warm-dark);letter-spacing:0.04em;line-height:1.05}
    .page-rule{width:52px;height:1px;background:var(--amber);margin:20px auto;opacity:0.55}
    .page-sub{font-size:0.8rem;font-weight:300;color:#7a6a5a;line-height:1.9;max-width:380px;margin:0 auto}

    /* ══ SPLIT LAYOUT ══ */
    .split-wrap{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;padding:clamp(32px,5vw,60px);gap:clamp(24px,4vw,48px)}

    /* Left: photo — stretches to match form height */
    .photo-panel{position:relative;overflow:hidden;border-radius:8px;min-height:300px}
    .photo-panel-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%;display:block}
    .photo-panel-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,25,8,0.1) 0%,rgba(12,25,8,0.35) 100%)}

    /* Right: RSVP embed panel */
    .form-panel{background:var(--cream);display:flex;flex-direction:column;justify-content:flex-start}
    .embed-wrap{width:100%}

    /* ══ FOOTER ══ */
    footer{text-align:center;padding:clamp(28px,4vw,40px) 20px;background:var(--cream);border-top:1px solid rgba(200,152,90,0.15);grid-column:1/-1}
    .footer-names{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.2rem,3vw,1.8rem);font-weight:300;color:var(--amber-dark);letter-spacing:0.04em}

    /* ══ MOBILE ══ */
    @media(max-width:768px){
      .split-wrap{grid-template-columns:1fr;padding:clamp(20px,4vw,32px)}
      .photo-panel{min-height:260px;max-height:360px}
      footer{grid-column:1}
    }
    @media(max-width:640px){:root{--diag:44px}}
  </style>
</head>
<body>

  <!-- ══ NAV ══ -->
  <nav>
    <a class="tab-btn" href="index.html">Welcome</a>
    <a class="tab-btn active" href="rsvp.html">RSVP</a>
  </nav>

  <!-- ══ PAGE HEADER ══ -->
  <div class="page-header">
    <div class="page-eyebrow">We hope to see you there</div>
    <h1 class="page-title">RSVP</h1>
    <div class="page-rule"></div>
    <p class="page-sub">Please let us know if you'll be joining us by <strong>June 15, 2026</strong>. We can't wait to celebrate with you.</p>
  </div>

  <div class="split-wrap">

    <!-- Left: photo -->
    <div class="photo-panel">
      <img class="photo-panel-img" src="images/rsvp-boardwalk-bw.jpg" alt="Leah and Ben">
      <div class="photo-panel-overlay"></div>
    </div>

    <!-- Right: embed -->
    <div class="form-panel">
      <div class="embed-wrap">
        <script type="text/javascript" src="https://leahandben.rsvpify.com/embed"></script>
      </div>
    </div>

    <!-- Footer (spans right column) -->
    <footer>
      <div class="footer-names">Leah &amp; Ben</div>
    </footer>

  </div>

</body>
</html>
