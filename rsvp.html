<!DOCTYPE html>
<html lang="en" style="background:#4A5320">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="color-scheme" content="light"/>
  <meta name="theme-color" content="#4A5320"/>
  <title>RSVP — Leah &amp; Ben</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ══ CRITICAL VARS (so page works before stylesheet loads) ══ */
    :root{--amber:#C8985A;--amber-dark:#9A7230;--sage:#6B7A35;--sage-light:#AABB72;--cream:#F6EFE0;--warm-dark:#26180A;--forest:#4A5320;--overlay:rgba(8,14,5,0.48);--diag:68px}

    /* ══ RSVP NOTE ══ */
    .rsvp-note{max-width:680px;margin:18px auto 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.05rem,2.2vw,1.25rem);font-weight:400;color:var(--warm-dark);line-height:1.75;opacity:0.8}
    .rsvp-deadline{font-family:'Cinzel',serif;font-size:0.72rem;font-weight:400;letter-spacing:0.16em;text-transform:uppercase;color:var(--amber-dark);margin-top:14px;display:inline-block;border-bottom:1px solid rgba(200,152,90,0.35);padding-bottom:3px}

    /* ══ SPLIT LAYOUT ══ */
    .split-wrap{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;padding:clamp(32px,5vw,60px);gap:clamp(24px,4vw,48px)}

    /* Left: photo */
    .photo-panel{position:relative;overflow:hidden;border-radius:8px;min-height:300px}
    .photo-panel-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 80%;display:block}
    .photo-panel-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(74,83,32,0.1) 0%,rgba(74,83,32,0.35) 100%)}

    /* Right: RSVP embed panel */
    .form-panel{background:var(--cream);display:flex;flex-direction:column;justify-content:flex-start}
    .embed-wrap{width:100%}

    /* ══ FOOTER ══ */
    footer{text-align:center;padding:clamp(28px,4vw,40px) 20px;background:var(--cream);border-top:1px solid rgba(200,152,90,0.15);grid-column:1/-1}

    /* ══ MOBILE ══ */
    @media(max-width:768px){
      .split-wrap{grid-template-columns:1fr;padding:clamp(20px,4vw,32px)}
      .photo-panel{min-height:260px;max-height:360px}
      footer{grid-column:1}
    }
  </style>
</head>
<body>
  <script>if(!sessionStorage.getItem("lb_unlocked")&&!localStorage.getItem("lb_pw"))window.location.replace("index.html");</script>

  <!-- ══ NAV ══ -->
  <nav class="nav-dark">
    <a class="tab-btn" href="index.html">Welcome</a>
    <a class="tab-btn" href="travel.html">Hotel &amp; Travel</a>
    <a class="tab-btn" href="faq.html">FAQ</a>
    <a class="tab-btn active" href="rsvp.html">RSVP</a>
  </nav>

  <!-- ══ PAGE HEADER ══ -->
  <div class="page-header">
    <h1 class="page-title">RSVP</h1>
    <div class="page-rule"></div>
    <p class="rsvp-note">We could have the most beautiful venue, the best food, and the perfect weather &mdash; but without you there, it wouldn&rsquo;t feel like home. Your presence is the greatest gift.</p>
    <div class="rsvp-deadline">Kindly reply by May 31, 2026</div>
  </div>

  <div class="split-wrap">

    <!-- Left: photo -->
    <div class="photo-panel">
      <img class="photo-panel-img" src="images/doorway.jpg" alt="Leah and Ben">
      <div class="photo-panel-overlay"></div>
    </div>

    <!-- Right: embed -->
    <div class="form-panel">
      <div class="embed-wrap">
        <script type="text/javascript" src="https://leahandben.rsvpify.com/embed"></script>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-names">Leah &amp; Ben</div>
    </footer>

  </div>


</body>
</html>
