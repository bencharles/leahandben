<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>RSVP — Leah &amp; Ben</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --amber:#C8985A;--amber-dark:#9A7230;
      --sage:#698A62;--cream:#F6EFE0;
      --warm-dark:#26180A;--forest:#0C1908;
      --diag:68px;
    }
    html,body{min-height:100%;font-family:'Jost',sans-serif;color:var(--warm-dark);overflow-x:hidden;-webkit-font-smoothing:antialiased;background:var(--cream)}

    /* ══ NAV ══ */
    nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:center;gap:clamp(6px,2vw,14px);padding:clamp(10px,2vw,16px) 20px;background:rgba(246,239,224,0.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(200,152,90,0.18)}
    .tab-btn{font-family:'Jost',sans-serif;font-size:0.64rem;font-weight:300;letter-spacing:0.36em;text-transform:uppercase;background:none;border:none;cursor:pointer;color:#9a8a7a;padding:8px 18px;border-radius:30px;transition:color 0.2s,background 0.2s;text-decoration:none;display:inline-block}
    .tab-btn.active{color:var(--warm-dark);background:rgba(200,152,90,0.15)}
    .tab-btn:hover{color:var(--warm-dark)}

    /* ══ HEADER HERO ══ */
    .page-header{padding:clamp(100px,14vw,140px) 20px clamp(60px,8vw,80px);text-align:center;position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--diag)),0 100%);padding-bottom:calc(clamp(60px,8vw,80px) + var(--diag));min-height:clamp(360px,55vw,520px);display:flex;align-items:center;justify-content:center}
    .page-header-bg{position:absolute;inset:0;background-image:url("images/rsvp-boardwalk-bw.jpg");background-size:cover;background-position:center 40%}
    .page-header-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,25,8,0.55) 0%,rgba(12,25,8,0.7) 100%)}
    .page-header-inner{position:relative;z-index:1}
    .page-eyebrow{font-size:0.6rem;letter-spacing:0.44em;text-transform:uppercase;color:var(--amber);font-weight:300;margin-bottom:14px}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,7vw,4.8rem);font-weight:300;color:#fff;letter-spacing:0.04em;line-height:1.1}
    .page-rule{width:55px;height:1px;background:var(--amber);margin:20px auto;opacity:0.6}
    .page-sub{font-size:clamp(0.58rem,1.4vw,0.72rem);font-weight:200;letter-spacing:0.36em;text-transform:uppercase;color:rgba(255,255,255,0.55)}

    /* ══ EMBED SECTION ══ */
    .embed-section{padding:clamp(50px,8vw,80px) clamp(16px,5vw,24px) clamp(60px,8vw,100px);max-width:860px;margin:0 auto}

    /* ══ FOOTER ══ */
    footer{text-align:center;padding:clamp(36px,5vw,52px) 20px clamp(24px,4vw,36px);background:var(--cream);border-top:1px solid rgba(200,152,90,0.15)}
    .footer-names{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.4rem,4vw,2rem);font-weight:300;color:var(--amber-dark);letter-spacing:0.04em}

    @media(max-width:640px){:root{--diag:44px}}
  </style>
</head>
<body>

  <!-- ══ NAV ══ -->
  <nav>
    <a class="tab-btn" href="index.html">Welcome</a>
    <a class="tab-btn active" href="rsvp.html">RSVP</a>
  </nav>

  <!-- ══ PAGE HEADER ══ -->
  <div class="page-header">
    <div class="page-header-bg"></div>
    <div class="page-header-inner">
      <div class="page-eyebrow">We hope to see you there</div>
      <h1 class="page-title">RSVP</h1>
      <div class="page-rule"></div>
      <div class="page-sub">Leah &amp; Ben &nbsp;&middot;&nbsp; August 15, 2026</div>
    </div>
  </div>

  <!-- ══ RSVPIFY EMBED ══ -->
  <div class="embed-section">
    <script type="text/javascript" src="https://leahandben.rsvpify.com/embed"></script>
  </div>

  <!-- ══ FOOTER ══ -->
  <footer>
    <div class="footer-names">Leah &amp; Ben</div>
  </footer>

</body>
</html>
